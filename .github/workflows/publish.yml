# Publish to the PowerShell Gallery.
#   * Push a version tag (e.g. v0.1.0)  -> real publish.
#   * Run manually (workflow_dispatch)  -> dry run by default (Publish-Module -WhatIf).
#
# Unlike a tests-only gate, this re-runs the FULL quality set (lint + reference-score
# tests + self-complexity gate) before publishing, so a release can't ship on a partial
# gate. One-time: add the PSGALLERY_API_KEY repo secret (Settings -> Secrets -> Actions).
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (Publish-Module -WhatIf, nothing is pushed)'
        type: boolean
        default: true

# NEVER cancel-in-progress here, unlike the other two. A superseded CI run is waste; a
# half-finished publish is a gallery version that cannot be withdrawn. The group serialises
# releases instead, so a second tag waits rather than racing the first.
concurrency:
  group: publish
  cancel-in-progress: false

# Least privilege on the one job that holds the gallery key.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load pinned versions
        shell: pwsh
        run: |
          $required = 'PESTER_VERSION', 'PSSA_VERSION'
          $pins = @{}
          foreach ($line in Get-Content .github/pins.env) {
            $t = $line.Trim()
            if (-not $t -or $t.StartsWith('#')) { continue }
            $k, $v = $t -split '=', 2
            $pins[$k.Trim()] = $v.Trim()
          }
          foreach ($k in $required) {
            if (-not $pins.ContainsKey($k) -or -not $pins[$k]) { throw ".github/pins.env is missing a value for $k" }
          }
          $pins.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION -Force -Scope CurrentUser

      - name: Full quality gate (lint + tests + self-complexity)
        shell: pwsh
        run: |
          # The same committed script ci.yml and code-scanning.yml run. This was a THIRD
          # inline copy, and it carried the severity filter too -- so the release path could
          # publish over a finding the required check was already blocking on.
          $f = ./tools/Invoke-PSCxAnalyzer.ps1
          if ($f) { $f | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize; throw "$($f.Count) lint finding(s) -- not publishing" }
          Import-Module ./PSComplexity.psd1 -Force
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'; $cfg.Run.PassThru = $true; $cfg.Output.Verbosity = 'Normal'
          # Match ci.yml: the classic `Should -Be` form is an error, not a style note.
          $cfg.Should.DisableV5 = $true
          $r = Invoke-Pester -Configuration $cfg
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed -- not publishing" }

      - name: Release consistency (ModuleVersion, CHANGELOG, ReleaseNotes)
        shell: pwsh
        run: ./tools/Test-PSCxRelease.ps1

      - name: Verify tag matches ModuleVersion
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Import-PowerShellDataFile ./PSComplexity.psd1).ModuleVersion
          if ($tag -ne $ver) { throw "Tag $tag does not match ModuleVersion $ver" }

      # A gallery version cannot be replaced or withdrawn, only unlisted, so a repeat
      # publish is the one outcome here that can never be undone. It is reachable by an
      # ordinary route too: publishing by hand (workflow_dispatch with dryRun off) and
      # then tagging the same commit for traceability. That second step should be a
      # no-op, not a red run.
      #
      # The skip is annotated as a WARNING on purpose. Skipping is right when the
      # version was published deliberately, but the same path is hit by a mistake --
      # forgetting to bump ModuleVersion -- where a silently green run would look like
      # a release that shipped when nothing did. The annotation surfaces it in the run
      # summary either way.
      - name: Skip if this version is already published
        id: exists
        shell: pwsh
        run: |
          $ver = (Import-PowerShellDataFile ./PSComplexity.psd1).ModuleVersion
          $found = Find-Module PSComplexity -RequiredVersion $ver -ErrorAction SilentlyContinue
          if ($found) {
              Write-Host "::warning::PSComplexity $ver is already on the PowerShell Gallery (published $($found.PublishedDate)) - skipping the publish step. If you meant to release new code, bump ModuleVersion."
              "already=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
              Write-Host "PSComplexity $ver is not on the gallery yet."
              "already=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish to PSGallery
        if: steps.exists.outputs.already != 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set' }
          $stage = Join-Path ([System.IO.Path]::GetTempPath()) 'PSComplexity'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item ./PSComplexity.psd1, ./PSComplexity.psm1, ./src, ./LICENSE, ./README.md -Destination $stage -Recurse -Force

          if ($env:DRY_RUN -eq 'true') {
              Write-Host '### DRY RUN -- Publish-Module -WhatIf ###' -ForegroundColor Yellow
              Publish-Module -Path $stage -NuGetApiKey $env:PSGALLERY_API_KEY -WhatIf -Verbose
              Write-Host '### DRY RUN complete -- nothing published. ###' -ForegroundColor Green
          }
          else {
              Publish-Module -Path $stage -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
              Write-Host '### Published to the PowerShell Gallery. ###' -ForegroundColor Green
          }
