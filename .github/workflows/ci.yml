# CI gate. Runs on Windows AND Linux (path/AST behaviour differs across platforms).
# Everything is in the "test" job -- a red lint, complexity self-gate, reference-score
# test, or unit failure blocks the merge. Dependencies are pinned for reproducibility.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run answers a question nobody is asking any more. Pushes to main are NOT
# cancelled -- that history is the record of what main was green at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. The default token is write-scoped, and this job installs four modules
# from the gallery and then executes them.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A wedged runner otherwise holds a REQUIRED check pending for the six-hour default,
    # blocking every merge behind it.
    #
    # Set for the LINUX leg, which is the only one that self-mutates and is therefore the only
    # one this number is about: Windows finishes in about two minutes, Linux in tens of them.
    # The budget is the mutant count times the per-mutant cost, and the mutant count grows
    # whenever src/ does -- adding one file took the set from roughly 195 mutants to 300 and
    # walked straight through a 20-minute limit, which GitHub reports as a CANCELLED job rather
    # than a failed one, so it reads like somebody stopped the run.
    #
    # Raising this is the stopgap, not the answer: per-mutant cost here is 4.3s against the
    # sibling project's 1.8s, because src/Ast.ps1 is mapped to two covering suites and pays for
    # both on every one of its mutants (#96).
    # 60, and the mutation step is 29 minutes of it -- measured, not guessed. The budget went
    # 20 -> 40 when that step first walked through it, and 40 -> 60 when the policy layer
    # arrived. Raising a timeout does not make a gate faster; it stops a slow gate reading as
    # a wedged runner, which holds a required check pending and blocks every merge behind it.
    # The cost itself is #96, and the lever that matters is a covering suite that does not
    # measure real source once per mutant.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load pinned versions
        shell: pwsh
        run: |
          $required = 'PESTER_VERSION', 'PESTER_COMPAT_VERSION', 'PSSA_VERSION',
                      'PSMUTANT_VERSION', 'CONVERTTOSARIF_VERSION', 'PSSA_PATHS'
          $pins = @{}
          foreach ($line in Get-Content .github/pins.env) {
            $t = $line.Trim()
            if (-not $t -or $t.StartsWith('#')) { continue }
            $k, $v = $t -split '=', 2
            $pins[$k.Trim()] = $v.Trim()
          }
          # Asserted, not assumed: a missing key would otherwise install "latest" or analyse
          # nothing, and both look like a clean run.
          foreach ($k in $required) {
            if (-not $pins.ContainsKey($k) -or -not $pins[$k]) { throw ".github/pins.env is missing a value for $k" }
          }
          $pins.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pins: $(($required | ForEach-Object { "$_=$($pins[$_])" }) -join '  ')"

      # Keyed on the pinned versions, so a bump invalidates it rather than serving the
      # previous ones. Windows and Linux keep separate caches: the module path differs.
      - name: Cache pinned PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
          key: psmodules-${{ runner.os }}-pester${{ env.PESTER_VERSION }}-${{ env.PESTER_COMPAT_VERSION }}-pssa${{ env.PSSA_VERSION }}-psmut${{ env.PSMUTANT_VERSION }}

      - name: Install pinned modules
        shell: pwsh
        run: |
          # Install only what is missing, then assert. An unconditional -Force collides with
          # what the runner image already ships: the install warns "currently in use", carries
          # on, and the tool then fails somewhere else entirely.
          $wanted = @(
            @{ Name = 'Pester';           Version = $env:PESTER_VERSION }
            @{ Name = 'Pester';           Version = $env:PESTER_COMPAT_VERSION }
            @{ Name = 'PSScriptAnalyzer'; Version = $env:PSSA_VERSION }
          )
          foreach ($w in $wanted) {
            if (-not (Get-Module $w.Name -ListAvailable | Where-Object Version -eq $w.Version)) {
              Install-Module $w.Name -RequiredVersion $w.Version -Force -Scope CurrentUser
            }
            if (-not (Get-Module $w.Name -ListAvailable | Where-Object Version -eq $w.Version)) {
              throw "$($w.Name) $($w.Version) is not available after install"
            }
          }

      - name: Module manifest is valid + imports
        shell: pwsh
        run: |
          Test-ModuleManifest ./PSComplexity.psd1 | Out-Null
          Import-Module ./PSComplexity.psd1 -Force
          Get-Command Measure-PSComplexity, Test-PSComplexity -ErrorAction Stop | Out-Null

      - name: Release consistency (ModuleVersion, CHANGELOG, ReleaseNotes)
        shell: pwsh
        # -CheckGallery here and not locally: the question is whether this version has
        # already shipped, which the working tree cannot answer.
        run: ./tools/Test-PSCxRelease.ps1 -CheckGallery

      # One committed script, called by this gate and by code-scanning.yml. Spelled out in
      # both, they disagreed about severity and scope, so an Information finding failed
      # nothing and blocked everything.
      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          # The script throws on its own now. The verdict used to live HERE, in YAML, while
          # the script exited 0 with findings -- so running it by hand was not the same as
          # passing it, and this step was the only thing that made it a gate.
          ./tools/Invoke-PSCxAnalyzer.ps1

      - name: Tests (reference scores + self-complexity gate)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          Import-Module ./PSComplexity.psd1 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.PassThru = $true
          # The classic `Should -Be` form is an ERROR, not a style note. Pester 6 keeps it
          # working, so without this the suite drifts back into a mix one test at a time.
          $cfg.Should.DisableV5 = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          . ./tools/ReleaseDecisions.ps1
          $fault = Get-PSCxTestRunFault -FailedCount $r.FailedCount `
              -ContainerResult @($r.Containers | ForEach-Object { [string]$_.Result }) `
              -ContainerName @($r.Containers | ForEach-Object { Split-Path $_.Item -Leaf })
          if ($fault) { throw $fault }

      # The step above ran the suite alphabetically. The mutation baseline below runs the
      # mapped covering suites in config order, and those two orders differ -- so an
      # order-dependent suite is green in one and red in the other, which is how the sibling
      # spent three CI rounds on a variable one file had cleared and not restored. Runs on both
      # platforms: only one of them reaches the mutation gate at all.
      - name: Order independence (the suite, reversed)
        shell: pwsh
        run: ./tools/Test-PSCxOrderIndependence.ps1

      # A committed script, not a snippet here, so measuring by hand and measuring in CI
      # cannot drift. The figure in CLAUDE.md was a claim nothing checked, and the one in
      # CHANGELOG.md had been wrong for two releases.
      - name: Coverage gate (100%)
        shell: pwsh
        run: ./tools/Measure-PSCxCoverage.ps1

      # Self-assess: mutation-test our own metric logic with our sibling module PSMutant,
      # gating on the score. (Linux only -- test quality is platform-independent.)
      - name: Self-assess (PSMutant mutation testing)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          if (-not (Get-Module PSMutant -ListAvailable | Where-Object Version -eq $env:PSMUTANT_VERSION)) {
            Install-Module PSMutant -RequiredVersion $env:PSMUTANT_VERSION -Force -Scope CurrentUser
          }
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          Import-Module PSMutant -RequiredVersion $env:PSMUTANT_VERSION -Force
          $r = Invoke-PSMutation -ConfigFile ./psmutant.self.config.json -SourceRoot . -Quiet
          Write-Host "Self mutation score: $($r.Score)% ($($r.Killed)/$($r.Total))"
          if ($r.ExitCode -ne 0) { throw "Mutation score $($r.Score)% is below the break threshold" }

      # Consumers gate on this module from inside THEIR Pester run, which is not the one
      # tests/ uses. Proven by running, in a child process, with a control assertion that
      # separates "this Pester cannot run here" from "this module is broken".
      - name: Pester compatibility (a Pester 5 consumer)
        shell: pwsh
        run: ./tools/Test-PSCxPesterCompatibility.ps1 -PesterVersion $env:PESTER_COMPAT_VERSION
