# CI gate. Runs on Windows AND Linux (path/AST behaviour differs across platforms).
# Everything is in the "test" job -- a red lint, complexity self-gate, reference-score
# test, or unit failure blocks the merge. Dependencies are pinned for reproducibility.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.8.0 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: Module manifest is valid + imports
        shell: pwsh
        run: |
          Test-ModuleManifest ./PSComplexity.psd1 | Out-Null
          Import-Module ./PSComplexity.psd1 -Force
          Get-Command Measure-PSComplexity, Test-PSComplexity -ErrorAction Stop | Out-Null

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $f = @()
          foreach ($p in './src', './tests', './PSComplexity.psm1', './PSComplexity.psd1') {
            $f += Invoke-ScriptAnalyzer -Path $p -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error, Warning
          }
          if ($f) { $f | Format-Table RuleName, ScriptName, Line, Message -AutoSize; throw "$($f.Count) lint finding(s)" }
          Write-Host 'Lint clean.'

      - name: Tests (reference scores + self-complexity gate)
        shell: pwsh
        run: |
          Import-Module ./PSComplexity.psd1 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed" }
